# YOUR settings file. The build script creates it once and never overwrites it.
# Chapter lists are generated into _quarto-web.yml and _quarto-docx-*.yml (profiles).
project:
  type: book

profile:
  default: web

book:
  title: "A Compilation of the Bab's Writings"
  subtitle: "Translated Using GPT-5"
  author: "The Bab"
  language: en
  site-url: https://bab.peopleofbaha.world
  reader-mode: true
  search: true
  page-footer:
    left: |
      Created by the Baha'i Translation Project
    right: |
      Translations used were created with GPT 5

execute:
  eval: false

# Render each format explicitly (render_all.py does this): --to html / --to docx
format:
  html:
    theme:
      - minty
      - assets/custom.scss
    fontsize: 10pt
    toc: true
    toc-depth: 6
    number-sections: false
    smooth-scroll: true
  docx:
    reference-doc: reference1.docx
    toc: true
    toc-depth: 1
    number-sections: false

# No PDF format on purpose: convert the DOCX files to PDF in Word.
